global:
  version: 2.5.4
  serviceAccountName: vault-auth
  cluster:
    provider: aws
    cloudNativeServices: false
  vault:
    type: hashicorp
    network: fabric
    address: http://vault.vault.svc:8200
    authPath: prodprelivegov
    secretEngine: secretsv2
    secretPrefix: "data/prodprelivegov"
    role: vault-role
    tls: false
  proxy:
    provider: haproxy
    externalUrlSuffix: org4proxy.hlf.doconchain.com

image:
  alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  fabricTools: ghcr.io/hyperledger/bevel-fabric-tools
  pullSecret: ""

peer:
  name: peer0
  type: anchor
  address: peer0.prelivegov-net.org4proxy.hlf.doconchain.com:443
  localMspId: prelivegovMSP
  logLevel: debug
  tlsStatus: true
  channelName: plchannel  
  ordererAddress: orderer2.doconchain-net.org1proxy.hlf.doconchain.com:443
  addPeerValue: false
  addnewOrgValue: false
