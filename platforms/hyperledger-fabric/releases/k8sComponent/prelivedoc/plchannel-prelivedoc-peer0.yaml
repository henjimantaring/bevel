global:
  version: 2.5.4
  serviceAccountName: vault-auth
  cluster:
    provider: aws
    cloudNativeServices: false
  vault:
    type: hashicorp
    network: fabric
    address: http://vault.vault.svc:8200
    authPath: prodprelivedoc
    secretEngine: secretsv2
    secretPrefix: "data/prodprelivedoc"
    role: vault-role
    tls: false
  proxy:
    provider: haproxy
    externalUrlSuffix: org3proxy.hlf.doconchain.com

image:
  alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  fabricTools: ghcr.io/hyperledger/bevel-fabric-tools
  pullSecret: ""

peer:
  name: peer0
  type: anchor
  address: peer0.prelivedoc-net.org3proxy.hlf.doconchain.com:443
  localMspId: prelivedocMSP
  logLevel: debug
  tlsStatus: true
  channelName: plchannel  
  ordererAddress: orderer2.doconchain-net.org1proxy.hlf.doconchain.com:443
  addPeerValue: false
  addnewOrgValue: false
