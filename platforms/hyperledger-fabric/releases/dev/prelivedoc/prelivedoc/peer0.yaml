apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: peer0
  namespace: prelivedoc-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: peer0
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-prod
        namespace: flux-prod
      chart: platforms/hyperledger-fabric/charts/fabric-peernode    
  values:
    global:
      version: 2.5.4
      serviceAccountName: vault-auth
      cluster:
        provider: aws
        cloudNativeServices: false
      vault:
        type: hashicorp
        network: fabric
        address: http://vault.vault.svc:8200
        authPath: prodprelivedoc
        secretEngine: secretsv2
        secretPrefix: "data/prodprelivedoc"
        role: vault-role
        tls: false
      proxy:
        provider: haproxy
        externalUrlSuffix: org3proxy.hlf.doconchain.com

    storage:
      enabled: False
      peer: 512Mi
      couchdb: 512Mi
      createStorageClass: false
      storageClass: gp2

    certs:
      generateCertificates: true
      orgData:
        caAddress: ca.prelivedoc-net.org3proxy.hlf.doconchain.com
        caAdminUser: prelivedoc-admin
        caAdminPassword: prelivedoc-adminpw
        orgName: prelivedoc
        type: peer
        componentSubject: "O=PLDoc,OU=Store,L=40.73/-74/New York,C=US"

      users: 
        usersList:
        - {'user': None, 'identity': 'user1', 'attributes': [{'key': 'hf.Revoker', 'value': 'true'}]}

      settings:
        createConfigMaps: True
        refreshCertValue: false
        addPeerValue: false
        removeCertsOnDelete: true
        removeOrdererTlsOnDelete: true

    image:
      couchdb: ghcr.io/hyperledger/bevel-fabric-couchdb
      peer: ghcr.io/hyperledger/bevel-fabric-peer
      alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
      pullSecret: ""

    peer:
      gossipPeerAddress: peer0.prelivedoc-net.org3proxy.hlf.doconchain.com:443
      logLevel: info
      localMspId: prelivedocMSP
      tlsStatus: true
      extraEnv:
        - name: CORE_METRICS_PROVIDER
          value: prometheus
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - peer
              topologyKey: kubernetes.io/hostname
      cliEnabled: True
      ordererAddress: orderer1.doconchain-net.org1proxy.hlf.doconchain.com:443
      builder: hyperledger/fabric-ccenv
      couchdb:
        username: prelivedoc-user
        password: prelivedoc-userpw
      mspConfig:
        organizationalUnitIdentifiers:
        nodeOUs:
          clientOUIdentifier: client
          peerOUIdentifier: peer
          adminOUIdentifier: admin
          ordererOUIdentifier: orderer
      serviceType: ClusterIP 
      loadBalancerType: ""
      metrics:
        provider: prometheus
      ports:
        grpc:
          clusterIpPort: 7051
        events:
          clusterIpPort: 7053
        couchdb:
          clusterIpPort: 5984
        metrics:
          enabled: True
          clusterIpPort: 9443    
      resources:
        limits:
          memory: 512Mi
          cpu: 0.5
        requests:
          memory: 256Mi
          cpu: 0.1
      upgrade: False
      healthCheck: 
        retries: 20
        sleepTimeAfterError: 15

    labels:
      service:
        - example1: example2
      pvc:
      deployment:
