# --- Diagnostics (optional but helpful) ---
- name: Show variables used to fetch the Secret
  debug:
    msg:
      kubeconfig: "{{ org.k8s.config_file }}"
      context: "{{ kubernetes.context | default('minikube') }}"
      namespace: "{{ org_name }}-net"
      secret_name: "admin-msp"

# --- Probe with kubectl to mirror the module behavior (optional) ---
- name: Probe with kubectl (should match the module)
  command: >
    kubectl --kubeconfig {{ org.k8s.config_file }}
    --context {{ kubernetes.context | default('minikube') }}
    -n {{ org_name }}-net
    get configmap {{ peer_name }}-msp-config -o json
  register: probe_cm
  changed_when: false
  failed_when: false


- name: Show probe result summary
  debug:
    msg: "{{ probe_admin_msp.stderr | default('') }}"

# Get admin msp certificates from secret
- name: Get admin msp certificates from secret
  kubernetes.core.k8s_info:
    kubeconfig: "{{ org.k8s.config_file }}"
    context: "{{ kubernetes.context | default('minikube') }}"
    api_version: v1
    kind: Secret
    name: "admin-msp"
    namespace: "{{ org_name }}-net"
  register: msp_cert_data

# Show what came back
- name: Debug admin-msp lookup
  debug:
    msg:
      count: "{{ (msp_cert_data.resources | default([])) | length }}"
      names: "{{ (msp_cert_data.resources | default([])) | map(attribute='metadata.name') | list | default([]) }}"
  changed_when: false

# Fail early with a clear message if not found
- name: Ensure admin-msp Secret exists
  assert:
    that: msp_cert_data.resources | length > 0
    fail_msg: >
      Secret 'admin-msp' not found in namespace '{{ org_name }}-net'
      using kubeconfig '{{ org.k8s.config_file }}' and context
      '{{ kubernetes.context | default('minikube') }}'.
      resources={{ msp_cert_data.resources | default([]) }}
  changed_when: false

# Create the output directory
- name: Create the certs directory if it does not exist
  file:
    path: "{{ playbook_dir }}/../../../{{ charts_dir }}/fabric-genesis/files"
    state: directory

# Save the whole Secret object (metadata + data) as JSON (optional)
- name: Save admin-msp Secret JSON (raw) for debugging
  copy:
    content: "{{ msp_cert_data.resources[0] | to_nice_json }}"
    dest: "{{ files_loc }}/{{ org_name }}-admin-msp-secret.json"
  vars:
    files_loc: "{{ playbook_dir }}/../../../{{ charts_dir }}/fabric-genesis/files"

# If you specifically want only the 'data' section (base64 values)
- name: Save admin-msp data section only
  copy:
    content: "{{ (msp_cert_data.resources[0].data | default({})) | to_nice_json }}"
    dest: "{{ files_loc }}/{{ org_name }}-admin-msp-data.json"
  vars:
    files_loc: "{{ playbook_dir }}/../../../{{ charts_dir }}/fabric-genesis/files"

