# ---- Visibility: show what we're about to use
- name: Show variables used to fetch the ConfigMap
  debug:
    msg:
      kubeconfig: "{{ org.k8s.config_file }}"
      context: "{{ org.k8s.context | default('minikube') }}"
      namespace: "{{ org_name }}-net"
      cm_name: "{{ peer_name }}-msp-config"

# ---- Sanity: kubeconfig exists
- name: Assert kubeconfig file exists
  stat:
    path: "{{ org.k8s.config_file }}"
  register: kubeconfig_stat

- name: Fail if kubeconfig is missing
  fail:
    msg: "Kubeconfig not found at {{ org.k8s.config_file }}"
  when: not kubeconfig_stat.stat.exists

# ---- Optional: show current-context from the SAME kubeconfig
- name: Print current-context from the same kubeconfig
  command: >
    kubectl --kubeconfig {{ org.k8s.config_file }} config current-context
  register: curctx
  changed_when: false

- name: Show current-context
  debug:
    var: curctx.stdout

# ---- Wait for the ConfigMap to appear (race-proof)
- name: Wait for peer MSP ConfigMap to exist
  kubernetes.core.k8s_info:
    kubeconfig: "{{ org.k8s.config_file }}"
    context: "{{ org.k8s.context | default('minikube') }}"
    kind: ConfigMap
    namespace: "{{ org_name }}-net"
    name: "{{ peer_name }}-msp-config"
  register: cm_info
  retries: 20            # ~3m20s total
  delay: 10
  until: cm_info.resources is defined and cm_info.resources | length > 0

# ---- Extra guard: assert we really have it
- name: Ensure ConfigMap exists
  assert:
    that:
      - cm_info.resources | length > 0
    fail_msg: >
      ConfigMap '{{ peer_name }}-msp-config' not found in namespace '{{ org_name }}-net'.
      resources={{ (cm_info.resources | default([])) | string }}

# ---- Create output dir
- name: Create the certs directory if it does not exist
  file:
    path: "{{ playbook_dir }}/../../../{{ charts_dir }}/fabric-genesis/files"
    state: directory

# ---- Save full ConfigMap JSON (original behavior)
- name: Save config peer msp config locally for genesis (entire CM)
  copy:
    content: "{{ cm_info.resources[0] | to_nice_json }}"
    dest: "{{ files_loc }}/{{ org_name }}-config-file.json"
  vars:
    files_loc: "{{ playbook_dir }}/../../../{{ charts_dir }}/fabric-genesis/files"

# ---- Optionally also save JUST the mspConfig data key as YAML
- name: Save only .data.mspConfig (optional)
  copy:
    content: "{{ cm_info.resources[0].data.mspConfig | default('') }}"
    dest: "{{ files_loc }}/{{ org_name }}-mspConfig.yaml"
  when: cm_info.resources[0].data is defined and 'mspConfig' in cm_info.resources[0].data
  vars:
    files_loc: "{{ playbook_dir }}/../../../{{ charts_dir }}/fabric-genesis/files"
