# Get the MSP ConfigMap(s) for this peer in this org namespace
- name: List MSP ConfigMaps in target namespace
  kubernetes.core.k8s_info:
    kubeconfig: "{{ org.k8s.config_file }}"
    kind: ConfigMap
    namespace: "{{ org_name }}-net"
    label_selectors:
      - "app.kubernetes.io/name={{ peer_name }}-msp-config"
  register: cm_list

# Fallback: also try by exact name (in case labels differ)
- name: Get MSP ConfigMap by exact name (fallback)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ org.k8s.config_file }}"
    kind: ConfigMap
    name: "{{ peer_name }}-msp-config"
    namespace: "{{ org_name }}-net"
  register: cm_by_name

- name: Choose the first found ConfigMap
  set_fact:
    cm_candidates: >-
      {{ (cm_list.resources | default([])) + (cm_by_name.resources | default([])) }}
    cm: "{{ (cm_candidates | list | unique | first) | default(None) }}"

# Helpful debug so you can see what was found
- name: Debug found ConfigMaps
  debug:
    msg:
      - "Looking for name={{ peer_name }}-msp-config in ns={{ org_name }}-net"
      - "Found names: {{ (cm_candidates | map(attribute='metadata.name') | list) | default([]) }}"

# Assert we actually found it
- name: Ensure ConfigMap exists
  assert:
    that:
      - cm is not none
      - cm.data is defined
      - cm.data.mspConfig is defined
    fail_msg: >-
      ConfigMap '{{ peer_name }}-msp-config' not found or missing data.mspConfig
      in namespace '{{ org_name }}-net'.
      Candidates: {{ (cm_candidates | map(attribute='metadata.name') | list) | default([]) }}

# Create the output directory
- name: Create the certs directory if it does not exist
  file:
    path: "{{ playbook_dir }}/../../../{{ charts_dir }}/fabric-genesis/files"
    state: directory

# Write ONLY the mspConfig content to disk
- name: Save config peer MSP config locally for genesis
  copy:
    content: "{{ cm.data.mspConfig }}"
    dest: "{{ files_loc }}/{{ org_name }}-config-file.yaml"
  vars:
    files_loc: "{{ playbook_dir }}/../../../{{ charts_dir }}/fabric-genesis/files"
